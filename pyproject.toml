[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marathon-cli"
version = "0.1.0"
description = "A terminal-based monitoring tool for Bungie's Marathon game on Steam"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Parker Bailey", email = "your.email@example.com"}
]
keywords = ["marathon", "bungie", "steam", "cli", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "requests>=2.31.0",
    "click>=8.1.0",
    "pyfiglet>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/marathon-cli"
Repository = "https://github.com/yourusername/marathon-cli"
Issues = "https://github.com/yourusername/marathon-cli/issues"

[project.scripts]
marathon-cli = "marathon_cli:cli"

[tool.setuptools]
packages = ["marathon_cli"]
